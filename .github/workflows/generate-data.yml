name: Generate Timetable Data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-data.yml"
      - "generate-data.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
  schedule:
    - cron: "1 0 * * 0"

permissions:
  contents: write

jobs:
  generate-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      FIREBASE_WARNING_COLLECTION: ${{ secrets.FIREBASE_WARNING_COLLECTION }}
      FIREBASE_WARNING_DOCUMENT: ${{ secrets.FIREBASE_WARNING_DOCUMENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Firebase config
        run: npm run firebase:config

      - name: Run tests
        run: npm test

      - name: Generate data
        run: npm run generate

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ firebase-config.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update timetable data"
            git push
          fi
